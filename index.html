<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0e0e1e;font-family:'Courier New',monospace;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;z-index:1}
#ui-layer{position:fixed;inset:0;z-index:10;pointer-events:none}
#ui-layer *{pointer-events:auto}
#main-menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,6,14,0.97)}
#main-menu.hidden{display:none}
.logo{font-size:3.5rem;font-weight:900;letter-spacing:.4em;color:#8a8a9a;margin-bottom:4px}
.logo-sub{font-size:.65rem;color:#555;letter-spacing:.5em;text-transform:uppercase;margin-bottom:2px}
.logo-ver{font-size:.5rem;color:#3a3a4a;letter-spacing:.15em;margin-bottom:20px}
.made-by{font-size:.55rem;color:#4a4a5a;letter-spacing:.3em;text-transform:uppercase;margin-bottom:24px}
.btn{width:260px;padding:14px;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.25em;background:transparent;border:1px solid #282838;color:#777;font-family:inherit;cursor:pointer;transition:all .2s;margin-top:8px;border-radius:3px}
.btn:hover{border-color:#444;color:#aaa;background:rgba(255,255,255,.02)}
.btn:active{transform:scale(.97)}
.btn.primary{border-color:#2a3a4a;color:#5580a0}
.btn.primary:hover{border-color:#3a5a7a;color:#7aa0c0;background:rgba(60,100,160,.04)}
#game-hud{position:absolute;inset:0;display:none;pointer-events:none}
#game-hud.active{display:block}
.hud-timer{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:.7rem;color:#4a4a5a;letter-spacing:.1em}
.hud-level{position:absolute;top:12px;left:12px;font-size:.55rem;color:#3a3a44;letter-spacing:.1em;text-transform:uppercase}
.hud-deaths{position:absolute;top:28px;left:12px;font-size:.5rem;color:#3a2020;letter-spacing:.08em}
.hud-dash{position:absolute;top:12px;right:60px;font-size:.5rem;color:#2a3a4a;letter-spacing:.08em;text-transform:uppercase}
.hud-pause{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.3);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;transition:all .15s}
.hud-pause:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.5)}
.hud-interact{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);font-size:.65rem;color:#4a4a28;letter-spacing:.08em;z-index:20;display:none;animation:pulse 1.5s infinite;pointer-events:none}
#touch-controls{position:absolute;bottom:0;left:0;right:0;display:none;padding:0 12px 14px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
#touch-controls.active{display:block}
.touch-row{display:flex;justify-content:space-between;align-items:flex-end}
.tb-group{display:flex;gap:10px;align-items:flex-end}
.tb{width:64px;height:64px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:12px;color:rgba(255,255,255,.35);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .1s}
.tb:active,.tb.pressed{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2)}
.tb.jump{width:76px;height:76px;border-radius:50%}
.tb.dash{width:52px;height:52px;border-radius:50%;font-size:12px;font-weight:700}
.tb.interact{width:44px;height:44px;border-radius:50%;font-size:13px;font-weight:700}
.hud-thread{position:absolute;top:26px;right:60px;font-size:.5rem;color:#2a2a4a;letter-spacing:.08em;text-transform:uppercase}
.right-grp{display:flex;flex-direction:column;gap:6px;align-items:center}
#pause-screen{position:absolute;inset:0;display:none;background:rgba(6,6,14,.94);flex-direction:column;align-items:center;justify-content:center}
#pause-screen.active{display:flex}
.pause-title{font-size:1.3rem;font-weight:900;color:#555;letter-spacing:.2em;margin-bottom:20px}
#story-screen{position:absolute;inset:0;display:none;background:rgba(6,6,14,.97);flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
#story-screen.active{display:flex}
.story-level{font-size:.6rem;color:#333;text-transform:uppercase;letter-spacing:.2em;margin-bottom:16px}
.story-text{font-size:.85rem;color:#4a4a5a;letter-spacing:.05em;max-width:340px;line-height:1.9;text-align:center}
.story-hint{font-size:.5rem;color:#2a2a3a;letter-spacing:.15em;margin-top:24px;text-transform:uppercase;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
#death-screen{position:absolute;inset:0;display:none;background:rgba(6,6,14,.94);flex-direction:column;align-items:center;justify-content:center}
#death-screen.active{display:flex}
.death-title{font-size:1.6rem;font-weight:900;color:#4a1e1e;letter-spacing:.2em;margin-bottom:8px}
.death-cause{color:#2e1212;font-size:.7rem;margin-bottom:16px}
#win-screen{position:absolute;inset:0;display:none;background:rgba(6,6,14,.94);flex-direction:column;align-items:center;justify-content:center}
#win-screen.active{display:flex}
.win-title{font-size:1.8rem;font-weight:900;color:#3a5a3a;letter-spacing:.2em;margin-bottom:8px}
.win-sub{color:#2a3a2a;font-size:.75rem;margin-bottom:16px}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#06060e;z-index:100}
#loading.hidden{display:none}
.loading-text{font-size:.7rem;color:#333;letter-spacing:.2em;text-transform:uppercase;animation:pulse 1.5s infinite}
</style>
</head>

// ═══ THREAD / ROPE SYSTEM (Unravel mechanic) ═══
var thread={active:false,constraint:null,anchorX:0,anchorY:0,sprite:null,length:0,targetLength:0,minLength:40,maxLength:400,climbSpeed:120,range:380};
var levelAnchors=[];
function createAnchor(data){
  var body=MBodies.circle(data.x,data.y,10,{isStatic:true,isSensor:true,label:'anchor'});
  MWorld.add(world,body);
  var spr=new PIXI.Container();gameContainer.addChild(spr);
  levelAnchors.push({body:body,sprite:spr,x:data.x,y:data.y});
}
function updateAnchors(){
  for(var i=0;i<levelAnchors.length;i++){
    var an=levelAnchors[i];an.sprite.removeChildren();var g=new PIXI.Graphics();
    // Ring visual
    g.circle(0,0,7);g.stroke({width:2,color:0x2a2a4a});
    g.circle(0,0,3);g.fill(0x7a7a92);
    // Glow hint if player nearby and thread not active
    if(!thread.active&&player.alive&&player.body){
      var dx=player.body.position.x-an.x,dy=player.body.position.y-an.y;
      var dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<thread.range){
        var glowA=0.08+Math.sin(player.animTime*3)*0.04;
        g.circle(0,0,12);g.fill({color:0x6a6aaa,alpha:glowA});
        g.circle(0,0,7);g.stroke({width:2,color:0x4a4a7a,alpha:0.5+Math.sin(player.animTime*3)*0.2});
      }
    }
    an.sprite.x=an.x;an.sprite.y=an.y;an.sprite.addChild(g);
  }
}
function shootThread(){
  if(thread.active||!player.alive||!player.body)return;
  // Find nearest anchor within range
  var nearest=null,nearestDist=thread.range;
  for(var i=0;i<levelAnchors.length;i++){
    var an=levelAnchors[i];
    var dx=player.body.position.x-an.x,dy=player.body.position.y-an.y;
    var dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<nearestDist){nearestDist=dist;nearest=an}
  }
  if(!nearest)return;
  thread.active=true;
  thread.anchorX=nearest.x;thread.anchorY=nearest.y;
  thread.length=nearestDist;thread.targetLength=nearestDist;
  // Create constraint from anchor point to player
  thread.constraint=MConstraint.create({
    pointA:{x:nearest.x,y:nearest.y},
    bodyB:player.body,pointB:{x:0,y:-PLAYER_H/4},
    length:nearestDist,stiffness:0.6,damping:0.02
  });
  MWorld.add(world,thread.constraint);
  // Visual container
  thread.sprite=new PIXI.Container();gameContainer.addChild(thread.sprite);
  tgHaptic('medium');
  var shootAngle=Math.atan2(nearest.y-player.body.position.y,nearest.x-player.body.position.x);
  spawnParticles(player.body.position.x,player.body.position.y-PLAYER_H/4,6,0x4a4a8a,{angle:shootAngle,spread:0.5,speed:2.5,life:0.4,size:2,gravity:0});
  spawnParticles(nearest.x,nearest.y,4,0x5a5a9a,{speed:1.5,life:0.3,size:2,gravity:0});
}
function detachThread(){
  if(!thread.active)return;
  thread.active=false;
  if(thread.constraint){MWorld.remove(world,thread.constraint);thread.constraint=null}
  if(thread.sprite){thread.sprite.destroy();thread.sprite=null}
  tgHaptic('light');
}
function updateThread(dt){
  if(!thread.active||!player.alive){
    if(thread.active)detachThread();
    return;
  }
  // Climb: adjust rope length with up/down
  var climbInput=0;
  if(keys['ArrowUp']||keys['KeyW'])climbInput=-1;
  if(keys['ArrowDown']||keys['KeyS'])climbInput=1;
  // Don't climb when also trying to jump (W = jump on some layouts)
  if(keys['Space']||keys['ArrowUp'])climbInput=0;
  if(climbInput!==0){
    thread.targetLength=Math.max(thread.minLength,Math.min(thread.maxLength,thread.targetLength+climbInput*thread.climbSpeed*dt));
  }
  // Smoothly adjust constraint length
  thread.length+=(thread.targetLength-thread.length)*0.12;
  if(thread.constraint)thread.constraint.length=thread.length;
  // Draw thread visual
  if(thread.sprite){
    thread.sprite.removeChildren();var g=new PIXI.Graphics();
    var px=player.body.position.x,py=player.body.position.y-PLAYER_H/4;
    // Curved thread with catenary sag
    var segs=14;var prevX=thread.anchorX,prevY=thread.anchorY;
    for(var i=1;i<=segs;i++){
      var t=i/segs;
      var tx=thread.anchorX+(px-thread.anchorX)*t;
      var ty=thread.anchorY+(py-thread.anchorY)*t;
      // Catenary sag
      var sag=Math.sin(t*Math.PI)*thread.length*0.06;
      ty+=sag;
      var alpha=0.5+Math.sin(player.animTime*6+i*0.5)*0.15;
      g.moveTo(prevX,prevY);g.lineTo(tx,ty);
      g.stroke({width:2,color:0x3a3a6a,alpha:alpha});
      prevX=tx;prevY=ty;
    }
    // Glow line
    g.moveTo(thread.anchorX,thread.anchorY);g.lineTo(px,py);
    g.stroke({width:5,color:0x2a2a5a,alpha:0.1});
    // Anchor point glow
    g.circle(thread.anchorX,thread.anchorY,4);
    g.fill({color:0x7a7aaa,alpha:0.4+Math.sin(player.animTime*4)*0.15});
    // Attachment point on player
    g.circle(px,py,3);
    g.fill({color:0x5a5a8a,alpha:0.3});
    thread.sprite.addChild(g);
  }
  // Thread particles
  if(Math.random()<0.1){
    var rt=Math.random();
    var rpx=thread.anchorX+(player.body.position.x-thread.anchorX)*rt;
    var rpy=thread.anchorY+(player.body.position.y-PLAYER_H/4-thread.anchorY)*rt;
    rpy+=Math.sin(rt*Math.PI)*thread.length*0.06;
    spawnParticles(rpx,rpy,1,0x4a4a7a,{speed:0.2,life:0.25,size:1,gravity:0});
  }
  // Auto-detach if too far
  var dx=player.body.position.x-thread.anchorX,dy=player.body.position.y-thread.anchorY;
  if(Math.sqrt(dx*dx+dy*dy)>thread.maxLength*1.5)detachThread();
}

var levelBodies=[],levelSprites=[];
function loadLevel(n){
  clearLevel();var lvl=LEVELS[n];if(!lvl)return;
  // Boundaries
  MWorld.add(world,MBodies.rectangle(lvl.width/2,-50,lvl.width,100,{isStatic:true,label:'boundary'}));
  MWorld.add(world,MBodies.rectangle(-50,lvl.height/2,100,lvl.height,{isStatic:true,label:'boundary'}));
  // Platforms
  for(var i=0;i<lvl.platforms.length;i++){var p=lvl.platforms[i];var body=MBodies.rectangle(p.x+p.w/2,p.y+p.h/2,p.w,p.h,{isStatic:true,label:'platform',friction:0.8});MWorld.add(world,body);var spr=new PIXI.Graphics();spr.rect(0,0,p.w,p.h);spr.fill(0x4a4a6a);spr.rect(0,0,p.w,2);spr.fill(0x6a6a8a);spr.rect(0,p.h-1,p.w,1);spr.fill(0x3a3a58);spr.x=p.x;spr.y=p.y;gameContainer.addChild(spr);levelSprites.push(spr)}
  // Spikes
  if(lvl.spikes)for(var i=0;i<lvl.spikes.length;i++){var s=lvl.spikes[i];MWorld.add(world,MBodies.rectangle(s.x+s.w/2,s.y-10,s.w,20,{isStatic:true,isSensor:true,label:'deathZone'}));var spr=new PIXI.Graphics();var cnt=Math.floor(s.w/10);for(var j=0;j<cnt;j++){var tx=j*10;spr.moveTo(tx+5,s.y-12);spr.lineTo(tx,s.y+2);spr.lineTo(tx+10,s.y+2);spr.closePath();spr.fill(0x7a3838)}spr.x=s.x;gameContainer.addChild(spr);levelSprites.push(spr)}
  // Saws
  sawBodies=[];sawSprites=[];if(lvl.saws)for(var i=0;i<lvl.saws.length;i++)createSaw(lvl.saws[i].x,lvl.saws[i].y,lvl.saws[i].r);
  // Moving platforms
  movingPlatforms=[];if(lvl.movingPlatforms)for(var i=0;i<lvl.movingPlatforms.length;i++)createMovingPlatform(lvl.movingPlatforms[i]);
  // Falling platforms
  fallingPlatforms=[];if(lvl.fallingPlatforms)for(var i=0;i<lvl.fallingPlatforms.length;i++)createFallingPlatform(lvl.fallingPlatforms[i]);
  // Levers & doors
  levelLevers=[];levelDoors=[];if(lvl.levers)for(var i=0;i<lvl.levers.length;i++)createLever(lvl.levers[i]);
  // Enemies
  levelEnemies=[];if(lvl.enemies)for(var i=0;i<lvl.enemies.length;i++)createEnemy(lvl.enemies[i]);
  // Pendulums
  pendulums=[];if(lvl.pendulums)for(var i=0;i<lvl.pendulums.length;i++)createPendulum(lvl.pendulums[i]);
  // Anchors
  levelAnchors=[];if(lvl.anchors)for(var i=0;i<lvl.anchors.length;i++)createAnchor(lvl.anchors[i]);
  // Exit
  if(lvl.exit){MWorld.add(world,MBodies.rectangle(lvl.exit.x+lvl.exit.w/2,lvl.exit.y+lvl.exit.h/2,lvl.exit.w,lvl.exit.h,{isStatic:true,isSensor:true,label:'exitZone'}));var espr=new PIXI.Container();var eg=new PIXI.Graphics();eg.rect(0,0,lvl.exit.w,lvl.exit.h);eg.fill({color:0x2a4a2a,alpha:0.7});eg.rect(0,0,lvl.exit.w,3);eg.fill({color:0x5a8a5a,alpha:0.9});eg.rect(0,0,2,lvl.exit.h);eg.fill({color:0x3a6a3a,alpha:0.7});eg.rect(lvl.exit.w-2,0,2,lvl.exit.h);eg.fill({color:0x3a6a3a,alpha:0.7});espr.addChild(eg);espr.x=lvl.exit.x;espr.y=lvl.exit.y;espr._isExit=true;gameContainer.addChild(espr)}
  createPlayer(lvl.spawn.x,lvl.spawn.y);
}
function clearLevel(){MWorld.clear(world,false);MEvents.off(engine,'collisionStart',onCollisionStart);MEvents.off(engine,'collisionEnd',onCollisionEnd);levelBodies=[];levelSprites=[];sawBodies=[];sawSprites=[];movingPlatforms=[];fallingPlatforms=[];levelLevers=[];levelDoors=[];levelEnemies=[];pendulums=[];levelAnchors=[];if(thread.active)detachThread();clearParticles();if(gameContainer)gameContainer.removeChildren();if(player.body){player.body=null;player.sprite=null}camera.x=0;camera.y=0}

// ═══ CAMERA ═══
var camera={x:0,y:0};
var exitGlowTime=0;
function updateExitGlow(dt){
  exitGlowTime+=dt;
  var children=gameContainer.children;
  for(var i=0;i<children.length;i++){
    if(children[i]._isExit){
      var ec=children[i];
      // Remove old glow (2nd+ child), keep base rect
      while(ec.children.length>1)ec.removeChildAt(ec.children.length-1);
      var gg=new PIXI.Graphics();
      var pulse=Math.sin(exitGlowTime*3)*0.3+0.7;
      // Outer glow circle
      gg.circle(20,40,60);gg.fill({color:0x3a7a3a,alpha:pulse*0.12});
      // Beam of light going up
      gg.moveTo(10,0);gg.lineTo(20,-60*pulse);gg.lineTo(30,0);
      gg.fill({color:0x3a8a3a,alpha:0.15+pulse*0.08});
      // Light particles floating up
      for(var j=0;j<3;j++){
        var py=-20-Math.sin(exitGlowTime*2+j*2)*40*pulse;
        var px=10+Math.sin(exitGlowTime*1.5+j*3)*8;
        gg.circle(px,py,2.5);gg.fill({color:0x6aaa6a,alpha:0.35+Math.sin(exitGlowTime*4+j)*0.15});
      }
      ec.addChild(gg);
      break;
    }
  }
}
function updateCamera(){if(!player.body||!pixiApp)return;var sw=pixiApp.screen.width,sh=pixiApp.screen.height;var tx=player.body.position.x-sw*0.35;var ty=player.body.position.y-sh*0.5;var lvl=LEVELS[state.level];tx=Math.max(0,Math.min(tx,lvl.width-sw));ty=Math.max(-200,Math.min(ty,lvl.height-sh));camera.x+=(tx-camera.x)*0.08;camera.y+=(ty-camera.y)*0.06;var sx=0,sy=0;if(state.shakeTime>0){sx=(Math.random()-0.5)*state.shakeAmount*2;sy=(Math.random()-0.5)*state.shakeAmount*2}gameContainer.x=-camera.x+sx;gameContainer.y=-camera.y+sy}

// ═══ PLAYER LIGHT & FOG ═══
var lightTime=0;
function updateLightAndFog(dt){
  lightTime+=dt;
  if(!lightCtx||!fogOverlay||!pixiApp)return;
  var sw=pixiApp.screen.width,sh=pixiApp.screen.height;
  // Player screen position
  var px=player.body?(player.body.position.x-camera.x):sw/2;
  var py=player.body?(player.body.position.y-camera.y):sh/2;

  // ═══ GLOBAL LIGHTING — all in one smooth canvas pass ═══
  lightCtx.clearRect(0,0,sw,sh);

  // Step 1: Fill everything with a very subtle darkness (ambient) — just enough for atmosphere
  lightCtx.globalCompositeOperation='source-over';
  lightCtx.fillStyle='rgba(2,2,8,0.03)';
  lightCtx.fillRect(0,0,sw,sh);

  // Step 2: Cut smooth radial hole around player (destination-out erases darkness)
  lightCtx.globalCompositeOperation='destination-out';
  var lightR=600+Math.sin(lightTime*1.2)*25;
  var mainGrad=lightCtx.createRadialGradient(px,py,0,px,py,lightR);
  mainGrad.addColorStop(0,'rgba(255,255,255,1)');
  mainGrad.addColorStop(0.25,'rgba(255,255,255,0.98)');
  mainGrad.addColorStop(0.45,'rgba(255,255,255,0.92)');
  mainGrad.addColorStop(0.6,'rgba(255,255,255,0.7)');
  mainGrad.addColorStop(0.75,'rgba(255,255,255,0.35)');
  mainGrad.addColorStop(0.88,'rgba(255,255,255,0.1)');
  mainGrad.addColorStop(1,'rgba(255,255,255,0)');
  lightCtx.fillStyle=mainGrad;
  lightCtx.beginPath();lightCtx.arc(px,py,lightR,0,Math.PI*2);lightCtx.fill();

  // Step 3: Cut smaller holes for exit and thread (soft light sources)
  var lvl=LEVELS[state.level];
  // Exit glow
  if(lvl&&lvl.exit){
    var ex=lvl.exit.x+lvl.exit.w/2-camera.x,ey=lvl.exit.y+lvl.exit.h/2-camera.y;
    var exitR=160+Math.sin(lightTime*2.5)*25;
    var exitGrad=lightCtx.createRadialGradient(ex,ey,0,ex,ey,exitR);
    exitGrad.addColorStop(0,'rgba(255,255,255,0.85)');
    exitGrad.addColorStop(0.3,'rgba(255,255,255,0.55)');
    exitGrad.addColorStop(0.6,'rgba(255,255,255,0.2)');
    exitGrad.addColorStop(1,'rgba(255,255,255,0)');
    lightCtx.fillStyle=exitGrad;
    lightCtx.beginPath();lightCtx.arc(ex,ey,exitR,0,Math.PI*2);lightCtx.fill();
  }
  // Thread anchor glow
  if(thread.active){
    var ax=thread.anchorX-camera.x,ay=thread.anchorY-camera.y;
    var anchorGrad=lightCtx.createRadialGradient(ax,ay,0,ax,ay,90);
    anchorGrad.addColorStop(0,'rgba(255,255,255,0.6)');
    anchorGrad.addColorStop(0.4,'rgba(255,255,255,0.3)');
    anchorGrad.addColorStop(0.7,'rgba(255,255,255,0.1)');
    anchorGrad.addColorStop(1,'rgba(255,255,255,0)');
    lightCtx.fillStyle=anchorGrad;
    lightCtx.beginPath();lightCtx.arc(ax,ay,90,0,Math.PI*2);lightCtx.fill();
  }

  // Step 4: Tint remaining darkness with subtle warm color (source-atop)
  lightCtx.globalCompositeOperation='source-atop';
  var tintGrad=lightCtx.createRadialGradient(px,py,0,px,py,lightR*0.8);
  tintGrad.addColorStop(0,'rgba(20,30,55,0.25)');
  tintGrad.addColorStop(0.5,'rgba(10,15,30,0.1)');
  tintGrad.addColorStop(1,'rgba(0,0,0,0)');
  lightCtx.fillStyle=tintGrad;
  lightCtx.fillRect(0,0,sw,sh);

  // Step 5: Add ambient glow BEHIND the dark overlay (destination-over = behind existing pixels)
  // This creates a warm light pool that makes the scene visible even beyond the cut-out
  lightCtx.globalCompositeOperation='destination-over';
  // Wide ambient glow around player
  var glowGrad=lightCtx.createRadialGradient(px,py,0,px,py,lightR*1.2);
  glowGrad.addColorStop(0,'rgba(18,24,48,0.4)');
  glowGrad.addColorStop(0.3,'rgba(14,18,36,0.3)');
  glowGrad.addColorStop(0.6,'rgba(10,14,28,0.15)');
  glowGrad.addColorStop(1,'rgba(0,0,0,0)');
  lightCtx.fillStyle=glowGrad;
  lightCtx.beginPath();lightCtx.arc(px,py,lightR*1.2,0,Math.PI*2);lightCtx.fill();
  // Global ambient light so the whole scene has a minimum visibility
  lightCtx.fillStyle='rgba(12,14,26,0.35)';
  lightCtx.fillRect(0,0,sw,sh);

  lightCtx.globalCompositeOperation='source-over';
  lightTexture.source.update();

  // ═══ FOG: subtle depth mist at bottom ═══
  fogOverlay.clear();
  var fogY=sh*0.65;
  for(var i=0;i<4;i++){
    var fy=fogY+i*30;
    var fa=0.01+i*0.008;
    fogOverlay.moveTo(0,fy);
    for(var x=0;x<sw;x+=40){
      var wave=Math.sin((x+lightTime*15+i*80)*0.008)*15+Math.sin((x-lightTime*10+i*50)*0.012)*8;
      fogOverlay.lineTo(x,fy+wave);
    }
    fogOverlay.lineTo(sw,sh);fogOverlay.lineTo(0,sh);fogOverlay.closePath();
    fogOverlay.fill({color:0x08081a,alpha:fa});
  }
}

// ═══ PARALLAX BACKGROUND ═══
var bgLayers=[];
function createBackground(){if(!bgContainer)return;bgContainer.removeChildren();bgLayers=[];
// Layer 0: Stars + Moon (furthest)
var l0=new PIXI.Graphics();
// Moon
l0.circle(2200,80,35);l0.fill({color:0x2a2a50,alpha:0.8});
l0.circle(2200,80,33);l0.fill({color:0x3a3a60,alpha:0.6});
// Moon glow
l0.circle(2200,80,55);l0.fill({color:0x222244,alpha:0.18});
l0.circle(2200,80,80);l0.fill({color:0x1a1a38,alpha:0.1});
// Stars
for(var i=0;i<80;i++){var sx=Math.random()*6000;var sy=Math.random()*350;var ss=0.3+Math.random()*1.2;var sa=0.3+Math.random()*0.6;l0.circle(sx,sy,ss);l0.fill({color:0x8a8aaa,alpha:sa})}
bgContainer.addChild(l0);bgLayers.push({sprite:l0,speed:0.03});
// Layer 1: Far mountains
var l1=new PIXI.Graphics();
for(var i=0;i<14;i++){var bx=i*200+Math.random()*80;var bh=60+Math.random()*180;l1.moveTo(bx,750);l1.lineTo(bx+40+Math.random()*40,750-bh);l1.lineTo(bx+80+Math.random()*50,750);l1.closePath();l1.fill(0x1e1e34)}
bgContainer.addChild(l1);bgLayers.push({sprite:l1,speed:0.08});
// Layer 2: Mid buildings/towers
var l2=new PIXI.Graphics();
for(var i=0;i<20;i++){var bx=i*120+Math.random()*50;var bh=40+Math.random()*120;l2.rect(bx,680-bh,20+Math.random()*20,bh);l2.fill(0x222244)}
// Occasional window lights
for(var i=0;i<8;i++){var wx=i*350+Math.random()*150;var wy=580+Math.random()*60;l2.rect(wx,wy,3,4);l2.fill({color:0x5a5a7a,alpha:0.4+Math.random()*0.3})}
bgContainer.addChild(l2);bgLayers.push({sprite:l2,speed:0.25});
// Layer 3: Near towers
var l3=new PIXI.Graphics();
for(var i=0;i<10;i++){var bx=i*250+Math.random()*100;var bh=80+Math.random()*200;l3.rect(bx,660-bh,12+Math.random()*10,bh);l3.fill(0x2a2a4a)}
// Dripping particles from towers
for(var i=0;i<4;i++){var dx=i*600+Math.random()*200;var dy=500+Math.random()*100;l3.circle(dx,dy,1.5);l3.fill({color:0x5a5a7a,alpha:0.4})}
bgContainer.addChild(l3);bgLayers.push({sprite:l3,speed:0.45})}
function updateBackground(){for(var i=0;i<bgLayers.length;i++){bgLayers[i].sprite.x=-camera.x*bgLayers[i].speed;bgLayers[i].sprite.y=-camera.y*bgLayers[i].speed*0.3}}

// ═══ INPUT ═══
var keys={},touchState={left:false,right:false,jump:false};
function initInput(){
  window.addEventListener('keydown',function(e){if(e.repeat)return;keys[e.code]=true;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){player.inputJumpPressed=true;e.preventDefault()}if(e.code==='KeyX'||e.code==='KeyL'||e.code==='ShiftLeft'){player.inputDashPressed=true;e.preventDefault()}if(e.code==='KeyE'||e.code==='ShiftRight'){player.inputInteractPressed=true;e.preventDefault()}if(e.code==='KeyT'||e.code==='KeyR'){player.inputThreadPressed=true;e.preventDefault()}if(e.code==='Escape')togglePause()});
  window.addEventListener('keyup',function(e){keys[e.code]=false});
  setupTouchButton('btn-left','left');setupTouchButton('btn-right','right');setupTouchButton('btn-jump','jump');
  // Dash button
  var db=document.getElementById('btn-dash');if(db){db.addEventListener('touchstart',function(e){e.preventDefault();player.inputDashPressed=true;db.classList.add('pressed')},{passive:false});db.addEventListener('touchend',function(e){e.preventDefault();db.classList.remove('pressed')},{passive:false});db.addEventListener('touchcancel',function(){db.classList.remove('pressed')})}
  // Interact button
  var ib=document.getElementById('btn-interact');if(ib){ib.addEventListener('touchstart',function(e){e.preventDefault();player.inputInteractPressed=true;ib.classList.add('pressed')},{passive:false});ib.addEventListener('touchend',function(e){e.preventDefault();ib.classList.remove('pressed')},{passive:false});ib.addEventListener('touchcancel',function(){ib.classList.remove('pressed')})}
  // Thread button
  var tb=document.getElementById('btn-thread');if(tb){tb.addEventListener('touchstart',function(e){e.preventDefault();player.inputThreadPressed=true;tb.classList.add('pressed')},{passive:false});tb.addEventListener('touchend',function(e){e.preventDefault();tb.classList.remove('pressed')},{passive:false});tb.addEventListener('touchcancel',function(){tb.classList.remove('pressed')})}
}
function setupTouchButton(id,action){var el=document.getElementById(id);if(!el)return;el.addEventListener('touchstart',function(e){e.preventDefault();touchState[action]=true;el.classList.add('pressed');if(action==='jump')player.inputJumpPressed=true},{passive:false});el.addEventListener('touchend',function(e){e.preventDefault();touchState[action]=false;el.classList.remove('pressed')},{passive:false});el.addEventListener('touchcancel',function(){touchState[action]=false;el.classList.remove('pressed')})}
function readInput(){var ix=0;if(keys['ArrowLeft']||keys['KeyA']||touchState.left)ix-=1;if(keys['ArrowRight']||keys['KeyD']||touchState.right)ix+=1;player.inputX=ix;player.inputJump=keys['Space']||keys['ArrowUp']||keys['KeyW']||touchState.jump}

// ═══ SCREEN MANAGEMENT ═══
function showScreen(name){state.screen=name;document.getElementById('main-menu').classList.toggle('hidden',name!=='menu');document.getElementById('game-hud').classList.toggle('active',name==='playing'||name==='story');document.getElementById('touch-controls').classList.toggle('active',name==='playing');document.getElementById('story-screen').classList.toggle('active',name==='story');document.getElementById('pause-screen').classList.toggle('active',name==='paused');document.getElementById('death-screen').classList.toggle('active',name==='dead');document.getElementById('win-screen').classList.toggle('active',name==='win')}
function showStoryScreen(n){var lvl=LEVELS[n];document.getElementById('story-level').textContent=(n+1)+'. '+lvl.name;document.getElementById('story-text').textContent=lvl.story;showScreen('story');setTimeout(function(){if(state.screen==='story')startPlaying()},7000)}
function startPlaying(){showScreen('playing');state.levelStartTime=performance.now();document.getElementById('hud-level').textContent=(state.level+1)+'. '+LEVELS[state.level].name}
function showDeathScreen(cause){var causes={fall:'пустота поглотила тебя',spikes:'пронзён шипами',saw:'разорван на части',enemy:'поглощён тенью',pendulum:'раздавлен маятником'};document.getElementById('death-cause').textContent=causes[cause]||cause;showScreen('dead')}
function winLevel(){player.alive=false;spawnParticles(player.body.position.x,player.body.position.y,15,0x3a6a3a,{speed:2,life:0.8,size:3,gravity:0.3});tgHaptic('success');setTimeout(function(){showScreen('win')},300)}
function togglePause(){if(state.screen==='playing')showScreen('paused');else if(state.screen==='paused')showScreen('playing')}

// ═══ GAME LOOP ═══
var lastTime=0;
function gameLoop(timestamp){
  requestAnimationFrame(gameLoop);
  var rawDt=Math.min((timestamp-lastTime)/1000,0.05);lastTime=timestamp;
  if(state.slowMoTimer>0){state.slowMoTimer-=rawDt;if(state.slowMoTimer<=0)state.slowMo=1}
  var dt=rawDt*state.slowMo;
  if(state.shakeTime>0){state.shakeTime-=rawDt;if(state.shakeTime<=0){state.shakeAmount=0;state.shakeTime=0}}
  if(state.screen==='playing'){readInput();updatePlayer(dt);
  // Variable gravity: lighter going up, heavier down, reduced at apex
  if(player.alive&&player.body){
    var pvy=player.body.velocity.y;
    if(pvy<0)engine.gravity.y=player.gravityUp;
    else if(pvy>0)engine.gravity.y=player.gravityDown;
    if(!player.onGround&&Math.abs(pvy)<player.apexThreshold)engine.gravity.y*=player.apexGravityMult;
  }
  MEngine.update(engine,dt*1000);updateSaws(dt);updateMovingPlatforms(dt);updateFallingPlatforms(dt);updateLevers();updateEnemies(dt);updatePendulums();updateAnchors();updateThread(dt);updateExitGlow(dt);updateCamera();updateBackground();updateLightAndFog(dt);updateParticles(rawDt);var elapsed=performance.now()-state.levelStartTime;var secs=Math.floor(elapsed/1000);var mins=Math.floor(secs/60);document.getElementById('hud-timer').textContent=mins+':'+(secs%60<10?'0':'')+(secs%60);document.getElementById('hud-deaths').textContent='смерти: '+state.deaths}
  if(state.screen==='story'){updateCamera();updateBackground()}
  if(state.screen!=='playing')updateParticles(rawDt);
}

// ═══ UI BINDINGS ═══
function bindUI(){
  document.getElementById('btn-play').addEventListener('click',function(){document.getElementById('main-menu').classList.add('hidden');state.level=0;state.deaths=0;initMatter();createBackground();loadLevel(state.level);showStoryScreen(state.level)});
  document.getElementById('story-screen').addEventListener('click',function(){if(state.screen==='story')startPlaying()});
  document.getElementById('story-screen').addEventListener('touchstart',function(e){e.preventDefault();if(state.screen==='story')startPlaying()},{passive:false});
  document.getElementById('hud-pause').addEventListener('click',togglePause);
  document.getElementById('btn-resume').addEventListener('click',function(){showScreen('playing')});
  document.getElementById('btn-quit').addEventListener('click',function(){clearLevel();showScreen('menu')});
  document.getElementById('btn-retry').addEventListener('click',function(){respawnPlayer();startPlaying()});
  document.getElementById('btn-next').addEventListener('click',function(){state.level++;state.deaths=0;if(state.level<LEVELS.length){clearLevel();loadLevel(state.level);showStoryScreen(state.level)}else{clearLevel();showScreen('menu')}});
}

// ═══ INIT ═══
async function init(){try{await initPixi();initInput();bindUI();document.getElementById('loading').classList.add('hidden');lastTime=performance.now();requestAnimationFrame(gameLoop);console.log('[VOID] Initialized')}catch(err){console.error('[VOID] Init failed:',err);var d=document.getElementById('loading');if(d){d.classList.remove('hidden');d.querySelector('.loading-text').textContent='ERROR: '+err.message}}}
init();
</script>
